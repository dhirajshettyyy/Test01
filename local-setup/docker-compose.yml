# Local, closed-loop Beckn v2 test network for beckn-v2-migration-docs.
#
# Six containers: Redis, two ONIX adapters (BAP + BPP, wired up with the
# V2 payload mapper), and two "sandbox" application simulators that
# auto-respond so a full discover -> confirm -> status round trip can be
# exercised without a real BAP/BPP app or a live network/registry.
#
# See ../README.md for how to bring this up and how to send edited
# payloads through it.
services:
  redis:
    image: redis:alpine
    container_name: onix-redis
    ports:
      - "6379:6379"
    networks:
      - beckn_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # BAP-side adapter. Outbound:  http://localhost:8081/bap/caller/<action>
  #                   Inbound:   http://localhost:8081/bap/receiver/<on_action>
  onix-bap:
    image: fidedocker/onix-adapter
    container_name: onix-bap
    platform: linux/amd64
    networks:
      - beckn_network
    ports:
      - "8081:8081"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis:6379
    volumes:
      - ./config:/app/config
    command: ["./server", "--config=/app/config/bap.yaml"]

  # BPP-side adapter. Inbound:   http://localhost:8082/bpp/receiver/<action>
  #                   Outbound:  http://localhost:8082/bpp/caller/<on_action>
  onix-bpp:
    image: fidedocker/onix-adapter
    container_name: onix-bpp
    platform: linux/amd64
    networks:
      - beckn_network
    ports:
      - "8082:8082"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis:6379
    volumes:
      - ./config:/app/config
    command: ["./server", "--config=/app/config/bpp.yaml"]

  # Mock BAP application - receives on_* callbacks and logs them.
  sandbox-bap:
    container_name: sandbox-bap
    image: fidedocker/sandbox-2.0:latest
    platform: linux/amd64
    environment:
      - NODE_ENV=production
      - PORT=3001
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - beckn_network

  # Mock BPP application - receives action requests and auto-generates on_*
  # responses.
  sandbox-bpp:
    container_name: sandbox-bpp
    image: fidedocker/sandbox-2.0:latest
    platform: linux/amd64
    environment:
      - NODE_ENV=production
      - PORT=3002
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - beckn_network

networks:
  beckn_network:
    name: beckn_network
    driver: bridge
