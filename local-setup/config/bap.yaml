# BAP-side ONIX adapter.
# Based on beckn-v2-migration-docs/configs/bap-config.yaml, adapted for a
# fully local, closed-loop test network (see ../README.md):
#   - otelsetup plugin removed (no OTEL collector in this local stack)
#   - routingConfig paths point at ./config/routing/*.yaml (hardcoded local
#     targets instead of the live registry, so nothing leaves the compose
#     network except registry key lookups and schema fetches)
#   - extendedSchema_enabled: "false" - the base v2 OpenAPI check (against
#     protocol-specifications-v2/beckn.yaml) still runs; only the extra
#     per-object @context fetches (schema.beckn.io/Attributes,
#     /PriceSpecification, etc.) are skipped. Flip back to "true" once you
#     have network access to schema.beckn.io, to validate those too.
appName: "onix-local-bap"
log:
  level: debug
  destinations:
    - type: stdout
  contextKeys:
    - transactionId
    - messageId
    - subscriber_id
    - module_id
http:
  port: 8081
  timeout:
    read: 30
    write: 30
    idle: 30
pluginManager:
  root: ./plugins

modules:
  - name: bapTxnReceiver
    path: /bap/receiver/
    handler:
      type: std
      role: bap
      httpClientConfig:
        maxIdleConns: 1000
        maxIdleConnsPerHost: 200
        idleConnTimeout: 300s
        responseHeaderTimeout: 5s
      plugins:
        registry:
          id: dediregistry
          config:
            url: https://fabric.nfh.global/registry/dedi
            registryName: subscribers.beckn.one
            timeout: 10
        keyManager:
          id: simplekeymanager
          config:
            # Pre-registered testnet identity on beckn.one/testnet - the same
            # one used by beckn-onix's own local-beckn-one-bap.yaml and the
            # beckn/starter-kit. Works out of the box against the live DeDi
            # registry for signature verification.
            subscriberId: bap.example.com
            keyId: 76EU7LZ7gfqj13dWDKR1Uitnim11mCoxWBPdzLxUpAMBPVdANKgyFM
            signingPrivateKey: TTQMAEy0xJcoRXRNofZAwZq1c3VH6j98UUaHP7budQQ=
            signingPublicKey: g/3swjI93IhZ0SScrVZapeLjU+W0AeiSid3LViYZJFo=
            encrPrivateKey: TTQMAEy0xJcoRXRNofZAwZq1c3VH6j98UUaHP7budQQ=
            encrPublicKey: g/3swjI93IhZ0SScrVZapeLjU+W0AeiSid3LViYZJFo=
        cache:
          id: cache
          config:
            addr: redis:6379
        payloadStore:
          id: payloadstore
          config:
            ttl: "24h"
            indexTTL: "25h"
            maxBodyBytes: "1048576"
            storeBody: "true"
            storeSignature: "true"
            compress: "true"
        schemaValidator:
          id: schemav2validator
          config:
            type: url
            location: https://raw.githubusercontent.com/beckn/protocol-specifications-v2/refs/tags/core-v2.0.0-lts/api/v2.0.0/beckn.yaml
            cacheTTL: "3600"
            extendedSchema_enabled: "false"
            extendedSchema_cacheTTL: "86400"
            extendedSchema_maxCacheSize: "100"
            extendedSchema_downloadTimeout: "30"
            extendedSchema_allowedDomains: "beckn.org,example.com,raw.githubusercontent.com,schema.beckn.io"
        signValidator:
          id: signvalidator
        signer:
          id: signer
        router:
          id: router
          config:
            routingConfig: ./config/routing/bap-receiver.yaml
        payloadTransformer:
          id: reqmapper
          config:
            role: bap
            mappingsFile: ./config/mappings.yaml
        middleware:
          - id: reqpreprocessor
            config:
              contextKeys: transactionId,messageId
              role: bap
      steps:
        - validateSign
        - addRoute
        - validateSchema
        - transformPayload

  - name: bapTxnCaller
    path: /bap/caller/
    handler:
      type: std
      role: bap
      httpClientConfig:
        maxIdleConns: 1000
        maxIdleConnsPerHost: 200
        idleConnTimeout: 300s
        responseHeaderTimeout: 5s
      plugins:
        registry:
          id: dediregistry
          config:
            url: https://fabric.nfh.global/registry/dedi
            registryName: subscribers.beckn.one
            timeout: 10
        keyManager:
          id: simplekeymanager
          config:
            subscriberId: bap.example.com
            keyId: 76EU7LZ7gfqj13dWDKR1Uitnim11mCoxWBPdzLxUpAMBPVdANKgyFM
            signingPrivateKey: TTQMAEy0xJcoRXRNofZAwZq1c3VH6j98UUaHP7budQQ=
            signingPublicKey: g/3swjI93IhZ0SScrVZapeLjU+W0AeiSid3LViYZJFo=
            encrPrivateKey: TTQMAEy0xJcoRXRNofZAwZq1c3VH6j98UUaHP7budQQ=
            encrPublicKey: g/3swjI93IhZ0SScrVZapeLjU+W0AeiSid3LViYZJFo=
        cache:
          id: cache
          config:
            addr: redis:6379
        payloadStore:
          id: payloadstore
          config:
            ttl: "24h"
            indexTTL: "25h"
            maxBodyBytes: "1048576"
            storeBody: "true"
            storeSignature: "true"
            compress: "true"
        schemaValidator:
          id: schemav2validator
          config:
            type: url
            location: https://raw.githubusercontent.com/beckn/protocol-specifications-v2/refs/tags/core-v2.0.0-lts/api/v2.0.0/beckn.yaml
            cacheTTL: "3600"
            extendedSchema_enabled: "false"
            extendedSchema_cacheTTL: "86400"
            extendedSchema_maxCacheSize: "100"
            extendedSchema_downloadTimeout: "30"
            extendedSchema_allowedDomains: "beckn.org,example.com,raw.githubusercontent.com,schema.beckn.io"
        router:
          id: router
          config:
            routingConfig: ./config/routing/bap-caller.yaml
        signer:
          id: signer
        payloadTransformer:
          id: reqmapper
          config:
            role: bap
            mappingsFile: ./config/mappings.yaml
        middleware:
          - id: reqpreprocessor
            config:
              contextKeys: transactionId,messageId
              role: bap
      steps:
        - transformPayload
        - addRoute
        - sign
        - validateSchema
