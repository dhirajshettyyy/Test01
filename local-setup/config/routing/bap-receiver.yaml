# Inbound routing for the BAP adapter (http://localhost:8081/bap/receiver/*).
# Every on_* callback the BAP receives is delivered to the sandbox-bap
# application simulator, which logs it - `docker compose logs -f
# sandbox-bap` (or the onix-bap logs themselves) is how you see the mapper's
# output for a response.
routingRules:
  - version: "2.0.0"
    targetType: "url"
    target:
      url: "http://sandbox-bap:3001/api/bap-webhook"
    endpoints:
      - on_discover
      - on_confirm
      - on_status
